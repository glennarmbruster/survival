<g transform="translate(265 47)"><ellipse cx="0" cy="0" rx="8" ry="5" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/><path d="M7 1 q12 1 9 10 q-3 7 4 9" fill="none" stroke="#506c46" stroke-width="2.4" /></g>
<g transform="translate(49 98)"><ellipse cx="0" cy="0" rx="8" ry="5" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/><path d="M7 1 q12 1 9 10 q-3 7 4 9" fill="none" stroke="#506c46" stroke-width="2.4" /></g>
<g transform="translate(103 98)"><ellipse cx="0" cy="0" rx="8" ry="5" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/><path d="M7 1 q12 1 9 10 q-3 7 4 9" fill="none" stroke="#506c46" stroke-width="2.4" /></g>
