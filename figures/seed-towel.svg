<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Count a sample of ten seeds</title>
<desc>A folded-open towel has ten seeds in two rows. Seven have visible roots, giving a sample result of seven out of ten.</desc>
