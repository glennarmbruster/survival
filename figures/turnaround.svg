<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Work back from the return deadline</title>
<desc>An example timeline has a 2 pm turnaround, two hours to walk back, and an hour of reserve before a 5 pm deadline.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<path d="M32 84 H288" fill="none" stroke="#223f3e" stroke-width="4" />
<rect x="34" y="72" width="166" height="24" rx="2" fill="#a9c3a1" stroke="#223f3e" stroke-width="2.4"/>
<rect x="200" y="72" width="86" height="24" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<text x="36" y="53" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">2 pm</text>
<text x="199" y="53" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">4 pm</text>
<text x="284" y="53" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">5 pm</text>
<text x="116" y="122" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Walk back</text>
<text x="247" y="122" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Reserve</text>
<text x="160" y="152" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Example return plan</text>
</svg>
