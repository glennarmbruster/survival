<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Read the settled layers from the bottom up</title>
<desc>A jar contains coarse sand on the bottom, silt in the middle, fine clay above it, and water on top.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<g transform="translate(62 43)"><rect x="0" y="0" width="63" height="78" rx="8" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/><path d="M3 16 Q18 12 31 16 T60 16 V70 Q60 75 55 75 H9 Q3 75 3 70Z" fill="#b7d9d8" stroke="#b7d9d8" stroke-width="2.4" /><rect x="0" y="-6" width="63" height="10" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/></g>
<rect x="66" y="83" width="55" height="33" rx="2" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<rect x="66" y="83" width="55" height="9" rx="1" fill="#b38a6e" stroke="#223f3e" stroke-width="2.4"/>
<rect x="66" y="92" width="55" height="9" rx="1" fill="#c5aa7a" stroke="#223f3e" stroke-width="2.4"/>
<text x="235" y="46" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">Clay</text><path d="M203 42 H174 L126 86" fill="none" stroke="#886e57" stroke-width="1.7" />
<text x="235" y="83" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">Silt</text><path d="M203 79 H174 L126 96" fill="none" stroke="#886e57" stroke-width="1.7" />
<text x="235" y="121" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">Sand</text><path d="M203 117 H174 L126 109" fill="none" stroke="#886e57" stroke-width="1.7" />
<text x="111" y="149" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">After settling</text>
