<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Record the uncertainty</title>
<desc>Two marks on a timeline show when power was last known to be on and when it was first noticed off. The outage began somewhere in between.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<path d="M23 83 H299" fill="none" stroke="#223f3e" stroke-width="3" />
<rect x="63" y="75" width="179" height="16" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<circle cx="63" cy="83" r="6" fill="#223f3e" stroke="#223f3e" stroke-width="2"/>
<circle cx="242" cy="83" r="6" fill="#223f3e" stroke="#223f3e" stroke-width="2"/>
<text x="69" y="46" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Last on</text>
<text x="243" y="46" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Found off</text>
<text x="160" y="123" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Start somewhere between</text>
<text x="160" y="147" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="14" text-anchor="middle" fill="#223f3e">the two observations</text>
</svg>
