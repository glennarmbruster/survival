<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Bring the outer thirds over the center</title>
<desc>Dashed lines divide a dough rectangle into thirds. Arrows fold each outside panel inward. The folded end shows three layers.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<rect x="18" y="44" width="175" height="69" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<path d="M76 44 V113 M135 44 V113" fill="none" stroke="#a9492b" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M35 61 L99 61 M92.2 65.2 L99 61 92.2 56.8" fill="none" stroke="#a9492b" stroke-width="3" />
<path d="M172 90 L112 90 M118.8 85.8 L112 90 118.8 94.2" fill="none" stroke="#a9492b" stroke-width="3" />
<rect x="214" y="61" width="86" height="13" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<rect x="214" y="73" width="86" height="13" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<rect x="214" y="85" width="86" height="13" rx="4" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<text x="102" y="144" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Fold in thirds</text>
<text x="257" y="144" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">End view</text>
</svg>
