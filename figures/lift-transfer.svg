<rect x="40" y="97" width="240" height="14" rx="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="2.4"/>
<rect x="62" y="87" width="197" height="7" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/>
<rect x="65" y="55" width="190" height="16" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/>
<path d="M160 53 L160 19 M164.2 25.8 L160 19 155.8 25.8" fill="none" stroke="#a9492b" stroke-width="3" />
<text x="160" y="145" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Lift without sliding sideways</text>
</svg>
