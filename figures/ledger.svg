<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Give each expense its own row</title>
<desc>A paper ledger pairs an expense with a receipt ID. The next expense starts on a fresh row.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<rect x="16" y="26" width="288" height="105" rx="4" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/>
<rect x="17" y="27" width="286" height="29" rx="3" fill="#a9c3a1" stroke="#223f3e" stroke-width="2.4"/>
<path d="M122 27 V130 M202 27 V130 M17 94 H302" fill="none" stroke="#223f3e" stroke-width="2.4" />
<text x="69" y="47" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">Expense</text>
<text x="162" y="47" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">Paid</text>
<text x="251" y="47" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">Receipt</text>
<text x="67" y="80" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">Ice</text>
<text x="162" y="80" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#223f3e">$6</text>
<text x="252" y="80" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="14" text-anchor="middle" fill="#223f3e">Nov16-A</text>
<text x="160" y="153" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Match each row to its receipt</text>
</svg>
