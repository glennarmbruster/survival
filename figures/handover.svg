<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Keep the order of events on one note</title>
<desc>A note has spaces for what happened, what was seen, what changed, and care already given.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<rect x="26" y="13" width="268" height="143" rx="5" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/>
<circle cx="48" cy="36" r="10" fill="#a9c3a1" stroke="#223f3e" stroke-width="2"/><text x="48" y="41" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="13" text-anchor="middle" fill="#223f3e">M</text><text x="67" y="41" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="start" fill="#223f3e">What happened and when</text>
<circle cx="48" cy="67" r="10" fill="#a9c3a1" stroke="#223f3e" stroke-width="2"/><text x="48" y="72" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="13" text-anchor="middle" fill="#223f3e">I</text><text x="67" y="72" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="start" fill="#223f3e">Injuries or symptoms seen</text>
<circle cx="48" cy="98" r="10" fill="#a9c3a1" stroke="#223f3e" stroke-width="2"/><text x="48" y="103" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="13" text-anchor="middle" fill="#223f3e">S</text><text x="67" y="103" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="start" fill="#223f3e">Signs and changes</text>
<circle cx="48" cy="129" r="10" fill="#a9c3a1" stroke="#223f3e" stroke-width="2"/><text x="48" y="134" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="13" text-anchor="middle" fill="#223f3e">T</text><text x="67" y="134" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="start" fill="#223f3e">Treatment and time</text>
</svg>
