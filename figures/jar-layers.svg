<g transform="translate(51 34)"><rect x="0" y="0" width="63" height="78" rx="8" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/><path d="M3 17 Q18 13 31 17 T60 17 V70 Q60 75 55 75 H9 Q3 75 3 70Z" fill="#b7d9d8" stroke="#b7d9d8" stroke-width="2.4" /><rect x="0" y="-6" width="63" height="10" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/></g>
<rect x="54" y="49" width="57" height="46" rx="2" fill="#e5ae62" stroke="#e5ae62" stroke-width="2.4"/>
<g transform="translate(204 34)"><rect x="0" y="0" width="63" height="78" rx="8" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/><path d="M3 17 Q18 13 31 17 T60 17 V70 Q60 75 55 75 H9 Q3 75 3 70Z" fill="#d7bb7f" stroke="#d7bb7f" stroke-width="2.4" /><rect x="0" y="-6" width="63" height="10" rx="3" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4"/></g>
<path d="M136 78 L179 78 M172.2 82.2 L179 78 172.2 73.8" fill="none" stroke="#a9492b" stroke-width="3" />
