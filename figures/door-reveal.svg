<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Read the gap above the door</title>
<desc>A front view shows a level frame and a door sagging at the latch side. The widening top gap is marked with an arrow.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<path d="M43 129 V23 H176 V129" fill="none" stroke="#886e57" stroke-width="6" />
<path d="M50 30 L168 45 V130 H50Z" fill="#e7c99f" stroke="#223f3e" stroke-width="2.4" />
<circle cx="151" cy="87" r="4" fill="#223f3e" stroke="#223f3e" stroke-width="2"/>
<rect x="43" y="42" width="11" height="11" rx="1" fill="#a9c3a1" stroke="#223f3e" stroke-width="2.4"/>
<rect x="43" y="110" width="11" height="11" rx="1" fill="#a9c3a1" stroke="#223f3e" stroke-width="2.4"/>
<text x="244" y="71" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Wider gap</text>
<path d="M215 63 L167 37 M175.0 36.6 L167 37 171.0 43.9" fill="none" stroke="#a9492b" stroke-width="3" />
<text x="160" y="153" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Compare both top corners</text>
</svg>
