<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Make the label readable on the shelf</title>
<desc>An example food label lists the dish, date, servings, and the finishing instruction on the visible front of a container.</desc>
<rect width="320" height="168" fill="#faf6eb"/>
<rect x="34" y="40" width="252" height="102" rx="12" fill="#b7d9d8" stroke="#223f3e" stroke-width="2.4"/>
<rect x="27" y="30" width="266" height="17" rx="5" fill="#82acac" stroke="#223f3e" stroke-width="2.4"/>
<rect x="53" y="56" width="214" height="72" rx="3" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/>
<text x="66" y="80" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="17" text-anchor="start" fill="#223f3e">Bean soup · cooked</text>
<text x="66" y="102" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="start" fill="#223f3e">Nov 16  /  2 servings</text>
<text x="66" y="121" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="15" text-anchor="start" fill="#223f3e">Add broth to thin</text>
</svg>
