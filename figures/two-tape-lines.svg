<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" stroke-linecap="round" stroke-linejoin="round">
<title>Tape parallel to the joint</title>
<desc>Two blue strips flank a narrow central caulk joint. The tape edges define the width of the bead.</desc>
