<rect x="33" y="26" width="254" height="103" rx="1" fill="#fffdf7" stroke="#223f3e" stroke-width="2.4"/>
<rect x="34" y="45" width="252" height="17" rx="0" fill="#b7d9d8" stroke="#223f3e" stroke-width="2.4"/>
<rect x="34" y="85" width="252" height="17" rx="0" fill="#b7d9d8" stroke="#223f3e" stroke-width="2.4"/>
<path d="M36 74 H285" fill="none" stroke="#886e57" stroke-width="4" />
<text x="160" y="151" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle" fill="#223f3e">Keep the joint exposed</text>
</svg>
